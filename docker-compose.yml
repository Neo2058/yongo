services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    restart: unless-stopped
    user: "1001:1001"
